[project]
name = "daylog"
version = "0.1.0"
description = "Local-first daily activity tracker and timesheet drafter."
requires-python = ">=3.9"
readme = "README.md"

# Core dependencies: none in Phase 1-3 — window tracking, git, and storage
# are all standard library (ctypes, sqlite3, subprocess, argparse).
# Later phases add narrowly-scoped third-party packages here, each with a
# one-line reason for why the standard library isn't enough:
#
#   icalendar   (Phase 4) — correct RFC 5545 RRULE (recurring event)
#                            expansion is impractical to hand-roll; the
#                            standard library has no ICS parser at all.
#   fastapi     (Phase 6) — JSON API server for the web UI.
#   uvicorn     (Phase 6) — ASGI server to run the FastAPI app.
#   pystray     (Phase 8) — optional system tray icon; the tool must work
#                            fully without it.
dependencies = []

[project.optional-dependencies]
# Test tooling only — never installed for end users of the CLI.
dev = [
    "pytest>=7.0",
]

[project.scripts]
daylog = "daylog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["daylog*"]
