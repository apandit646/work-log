[project]
name = "daylog"
version = "0.1.0"
description = "Local-first daily activity tracker and timesheet drafter."
requires-python = ">=3.9"
readme = "README.md"

# Window tracking, git, and storage (Phases 1-3) are all standard library
# (ctypes, sqlite3, subprocess, argparse). Every dependency below is
# narrowly scoped to one phase, with a one-line reason the standard
# library isn't enough:
#
#   icalendar      (Phase 4) — RFC 5545 .ics parsing (VEVENT, VTIMEZONE,
#                               EXDATE, all-day vs timed values); the
#                               standard library has no ICS parser at all.
#   python-dateutil (Phase 4) — RRULE (recurring event) expansion is
#                               impractical and error-prone to hand-roll;
#                               this is icalendar's own recommended pair.
#   fastapi        (Phase 6) — JSON API server for the web UI.
#   uvicorn        (Phase 6) — ASGI server to run the FastAPI app.
#
# pystray/Pillow (Phase 8, system tray icon) and anthropic (Phase 9,
# optional LLM draft polishing) are deliberately NOT core dependencies —
# see [project.optional-dependencies] below — because "make the tool work
# fully without it" means `pip install daylog` must not require a working
# tray/notification-area stack, nor an Anthropic API key, at all.
dependencies = [
    "icalendar>=5.0",
    "python-dateutil>=2.8",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
# Test tooling only — never installed for end users of the CLI. anthropic
# is here (not just under `llm`) so llm.py's success/error-handling paths
# have real SDK exception classes to test against, with every network
# call mocked — tests never make a real API call or need a real key.
dev = [
    "pytest>=7.0",
    "httpx2>=2.0",  # required by fastapi.testclient.TestClient (starlette's HTTP client dependency)
    "anthropic>=0.40",
]
# `pip install daylog[tray]` / `pipx install ".[tray]"` — 'daylog tray'
# prints a clear "install the tray extra" message and exits 1 without this;
# every other command works with just the core dependencies.
tray = [
    "pystray>=0.19",
    "Pillow>=9.0",  # pystray's own icon-image backend
]
# `pip install daylog[llm]` — enables config.llm.enabled (off by default).
# Without this, 'daylog report'/'daylog ui' work exactly as before;
# polish_draft() just reports "package not installed" and the plain
# rule-based draft is used, same as any other polling failure.
llm = [
    "anthropic>=0.40",
]

[project.scripts]
daylog = "daylog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["daylog*"]

[tool.setuptools.package-data]
# daylog/web/ isn't a Python package (no __init__.py, just static
# assets) so packages.find won't pick it up on its own — this ensures
# index.html/app.js/style.css ship in the installed wheel, not just the
# source checkout.
daylog = ["web/*"]
