[project]
name = "daylog"
version = "0.1.0"
description = "Local-first daily activity tracker and timesheet drafter."
requires-python = ">=3.9"
readme = "README.md"

# Window tracking, git, and storage (Phases 1-3) are all standard library
# (ctypes, sqlite3, subprocess, argparse). Every dependency below is
# narrowly scoped to one phase, with a one-line reason the standard
# library isn't enough:
#
#   icalendar      (Phase 4) — RFC 5545 .ics parsing (VEVENT, VTIMEZONE,
#                               EXDATE, all-day vs timed values); the
#                               standard library has no ICS parser at all.
#   python-dateutil (Phase 4) — RRULE (recurring event) expansion is
#                               impractical and error-prone to hand-roll;
#                               this is icalendar's own recommended pair.
#   fastapi        (Phase 6) — JSON API server for the web UI.
#   uvicorn        (Phase 6) — ASGI server to run the FastAPI app.
#   pystray        (Phase 8) — optional system tray icon; the tool must
#                               work fully without it.
dependencies = [
    "icalendar>=5.0",
    "python-dateutil>=2.8",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
# Test tooling only — never installed for end users of the CLI.
dev = [
    "pytest>=7.0",
    "httpx2>=2.0",  # required by fastapi.testclient.TestClient (starlette's HTTP client dependency)
]

[project.scripts]
daylog = "daylog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["daylog*"]
